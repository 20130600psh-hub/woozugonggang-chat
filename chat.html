<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매칭 채팅방</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
    }

    .chat-container {
      width: min(700px, 100%);
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      padding: 18px;
      color: white;
      background: #222;
      font-size: 20px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      width: fit-content;
      max-width: 75%;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #eeeeee;
      word-break: break-word;
    }

    .message.mine {
      margin-left: auto;
      background: #d9fdd3;
    }

    .message-form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    .message-form input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .message-form button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #222;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="chat-container">
    <header class="chat-header">
      매칭 채팅방
    </header>

    <section id="messages"></section>

    <form id="messageForm" class="message-form">
      <input
        id="messageInput"
        type="text"
        placeholder="메시지를 입력하세요"
        autocomplete="off"
      />
      <button type="submit">전송</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
